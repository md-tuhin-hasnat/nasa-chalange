<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Outpost ESM: The Astronaut Odyssey (Babylon.js + Havok)</title>
    <style>
      html, body {
        overflow: hidden;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #000000;
        user-select: none;
        -webkit-user-select: none;
      }
      #renderCanvas {
        width: 100%;
        height: 100%;
        touch-action: none;
        outline: none;
        display: block;
      }
      #loaderScreen {
        position: absolute;
        inset: 0;
        background-color: #040814;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #00f0ff;
        font-family: 'Courier New', Courier, monospace;
        z-index: 100;
        transition: opacity 0.5s ease-out;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 3px solid rgba(0, 240, 255, 0.2);
        border-top-color: #00f0ff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .loader-text {
        font-size: 13px;
        letter-spacing: 2px;
        font-weight: bold;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="loaderScreen">
      <div class="spinner"></div>
      <div class="loader-text">INITIALIZING BABYLON.JS & HAVOK PHYSICS...</div>
    </div>
    <canvas id="renderCanvas"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
